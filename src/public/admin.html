<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kullanıcı Yönetimi | Voleybol Skorboard</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="icon" href="/assets/volleyball.svg">
  <script>
  (function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}else{var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light')}})();
  </script>
  <style>
    .admin-container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 16px;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--text-heading);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .nav-brand span span { color: var(--fb-yellow); }
    .nav-brand img { width: 32px; height: 32px; }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      border: 1px solid var(--border-color);
      background: var(--overlay-bg);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav:hover {
      background: var(--overlay-hover);
      border-color: var(--overlay-border-strong);
    }
    .btn-nav.active {
      background: var(--accent-yellow-bg);
      border-color: var(--accent-yellow-border);
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-heading);
      margin-bottom: 4px;
    }
    .page-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-tile {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-heading);
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .search-input, .filter-select {
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }
    .search-input { flex: 1; min-width: 200px; }
    .search-input:focus, .filter-select:focus { border-color: var(--fb-yellow); }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .user-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }
    .user-item.disabled { opacity: 0.7; }
    .user-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 18px;
    }
    .user-email {
      font-weight: 800;
      color: var(--text-heading);
      font-size: 0.98rem;
      overflow-wrap: anywhere;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .user-meta {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 4px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border: 1px solid transparent;
    }
    .badge-admin { background: var(--accent-yellow-bg); border-color: var(--accent-yellow-border); color: var(--text-heading); }
    .badge-ok { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .badge-warn { background: var(--overlay-bg); border-color: var(--overlay-border); color: var(--accent-amber-text); }
    .badge-off { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
    .badge-me { background: var(--overlay-bg); border-color: var(--overlay-border); color: var(--text-tertiary); }

    .user-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .act-btn {
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      border: 1px solid var(--border-color);
      background: var(--overlay-bg);
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .act-btn:hover { background: var(--overlay-hover); border-color: var(--overlay-border-strong); }
    .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .act-btn.danger { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
    .act-btn.danger:hover { background: var(--error-border); }

    .user-detail {
      display: none;
      border-top: 1px solid var(--border-color);
      padding: 14px 18px;
      background: var(--bg-surface);
      font-size: 0.85rem;
    }
    .user-item.expanded .user-detail { display: block; }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .detail-title {
      font-weight: 800;
      color: var(--text-tertiary);
      margin-bottom: 8px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .detail-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .detail-list li {
      color: var(--text-main);
      overflow-wrap: anywhere;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .detail-head .detail-title { margin-bottom: 0; }
    .act-btn.small { padding: 4px 8px; font-size: 0.72rem; }
    .btn-create {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.88rem;
      border: none;
      background: var(--fb-yellow);
      color: var(--btn-primary-text);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-create:hover { background: var(--fb-yellow-hover); }

    /* Form dialogs (create user, transfer) */
    .fd-box { max-width: 460px; }
    .fd-box .cd-input { font-size: 0.95rem; letter-spacing: 0; padding: 11px 12px; }
    .fd-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .fd-items {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px;
      background: var(--bg-input);
    }
    .fd-items label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 0.88rem;
      color: var(--text-main);
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    .fd-items label:hover { background: var(--overlay-bg); }
    .fd-items code { color: var(--text-muted); font-size: 0.78rem; }
    .fd-select-all { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 0; }
    .fd-select-all:hover { color: var(--text-main); }
    .detail-list code { color: var(--text-muted); font-size: 0.78rem; }
    .detail-empty { color: var(--text-muted); }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--modal-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 2000;
      max-width: calc(100vw - 32px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: var(--error-border); color: var(--error-text); }

    @media (max-width: 760px) {
      .admin-container { padding: 16px 16px 60px; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .user-row { grid-template-columns: 1fr; }
      .user-actions { justify-content: flex-start; }
      .detail-grid { grid-template-columns: 1fr; }
      .btn-create { width: 100%; }
    }
  </style>
</head>
<body>

<div class="admin-container">
  <header class="top-nav">
    <a href="/" class="nav-brand">
      <img src="/assets/volleyball.svg" alt="Logo">
      <span>Voleybol<span>Skor</span></span>
    </a>
    <div class="nav-user">
      <button class="theme-toggle" onclick="toggleTheme()" title="Tema Değiştir" aria-label="Tema Değiştir">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </button>
      <a href="/" class="btn-nav">🏠 Ana Panel</a>
      <a href="/teams" class="btn-nav">🏐 Takımlar</a>
      <a href="/admin" class="btn-nav active">🛡️ Kullanıcılar</a>
    </div>
  </header>

  <h1 class="page-title">Kullanıcı Yönetimi</h1>
  <p class="page-desc">Kayıtlı kullanıcıları görüntüleyin, doğrulayın, askıya alın, şifrelerini sıfırlayın veya silin.</p>

  <div class="stats-row">
    <div class="stat-tile"><div class="stat-label">Toplam</div><div class="stat-value" id="stat-total">–</div></div>
    <div class="stat-tile"><div class="stat-label">Doğrulanmış</div><div class="stat-value" id="stat-verified">–</div></div>
    <div class="stat-tile"><div class="stat-label">Askıda</div><div class="stat-value" id="stat-disabled">–</div></div>
    <div class="stat-tile"><div class="stat-label">Skorboard</div><div class="stat-value" id="stat-boards">–</div></div>
  </div>

  <div class="toolbar">
    <input type="search" id="search" class="search-input" placeholder="🔍 E-posta ara..." autocomplete="off">
    <select id="filter" class="filter-select" aria-label="Filtre">
      <option value="all">Tümü</option>
      <option value="verified">Doğrulanmış</option>
      <option value="unverified">Doğrulanmamış</option>
      <option value="disabled">Askıda</option>
      <option value="admin">Yöneticiler</option>
    </select>
    <button type="button" class="btn-create" id="btn-create-user">+ Yeni Kullanıcı</button>
  </div>

  <div class="user-list" id="user-list">
    <div class="empty-state">Yükleniyor...</div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/js/confirm-dialog.js?v=1.2.0"></script>
<script>
  let users = [];
  let currentUserId = null;
  const expanded = new Set();
  const detailCache = new Map();

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatDate(ts) {
    if (!ts) return '—';
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  let toastTimer = null;
  function toast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.toggle('error', Boolean(isError));
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  async function api(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    if (res.status === 401) { window.location.href = '/login'; throw new Error('Giriş gerekli'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) throw new Error(data.error || 'İşlem başarısız.');
    return data;
  }

  async function loadUsers() {
    try {
      const data = await api('/api/admin/users');
      users = data.users;
      currentUserId = data.currentUserId;
      render();
    } catch (err) {
      document.getElementById('user-list').innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
    }
  }

  function renderStats() {
    document.getElementById('stat-total').textContent = users.length;
    document.getElementById('stat-verified').textContent = users.filter((u) => u.isVerified).length;
    document.getElementById('stat-disabled').textContent = users.filter((u) => u.isDisabled).length;
    document.getElementById('stat-boards').textContent = users.reduce((n, u) => n + u.boardCount, 0);
  }

  function filteredUsers() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const f = document.getElementById('filter').value;
    return users.filter((u) => {
      if (q && !u.email.toLowerCase().includes(q)) return false;
      if (f === 'verified') return u.isVerified;
      if (f === 'unverified') return !u.isVerified;
      if (f === 'disabled') return u.isDisabled;
      if (f === 'admin') return u.isAdmin;
      return true;
    });
  }

  function boardLabel(b) {
    return `${escapeHtml(b.title || b.id)} <code>${escapeHtml(b.id)}</code>`;
  }
  function teamLabel(t) {
    return `${escapeHtml(t.name)}${t.shortName ? ` <code>${escapeHtml(t.shortName)}</code>` : ''}`;
  }

  function renderDetail(id) {
    const d = detailCache.get(id);
    if (!d) return '<span class="detail-empty">Yükleniyor...</span>';
    const canTransfer = users.length > 1;
    const isCopy = (act) => act === 'transfer-team';
    const moveBtn = (act, itemId) => canTransfer
      ? `<button class="act-btn small" data-act="${act}" data-item="${escapeHtml(itemId)}" title="${isCopy(act) ? 'Başka kullanıcıya kopyala' : 'Başka kullanıcıya aktar'}">${isCopy(act) ? '⧉ Kopyala' : '↪ Aktar'}</button>`
      : '';
    const allBtn = (act, count) => canTransfer && count > 1
      ? `<button class="act-btn small" data-act="${act}">${isCopy(act) ? '⧉ Tümünü Kopyala' : '↪ Tümünü Aktar'}</button>`
      : '';
    const boards = d.boards.length
      ? d.boards.map((b) => `<li><span>${boardLabel(b)}${b.teamA || b.teamB ? `<br><span class="detail-empty">${escapeHtml(b.teamA)} – ${escapeHtml(b.teamB)}</span>` : ''}</span>${moveBtn('transfer-board', b.id)}</li>`).join('')
      : '<li class="detail-empty">Skorboard yok</li>';
    const teams = d.teams.length
      ? d.teams.map((t) => `<li><span>${teamLabel(t)}</span>${moveBtn('transfer-team', t.id)}</li>`).join('')
      : '<li class="detail-empty">Takım yok</li>';
    return `<div class="detail-grid">
      <div><div class="detail-head"><div class="detail-title">Skorboardlar</div>${allBtn('transfer-board', d.boards.length)}</div><ul class="detail-list">${boards}</ul></div>
      <div><div class="detail-head"><div class="detail-title">Takımlar</div>${allBtn('transfer-team', d.teams.length)}</div><ul class="detail-list">${teams}</ul></div>
    </div>`;
  }

  // Tema uyumlu form penceresi. onSubmit(form) -> Promise<string>: boş = başarılı (pencere kapanır), dolu = hata mesajı
  function openFormDialog({ icon, title, bodyHtml, fieldsHtml, confirmText, onSubmit }) {
    return new Promise((resolve) => {
      const backdrop = document.createElement('div');
      backdrop.className = 'cd-backdrop';
      backdrop.innerHTML = `
        <form class="cd-box fd-box" role="dialog" aria-modal="true" autocomplete="off" novalidate>
          <div class="cd-head">
            <span class="cd-icon cd-primary">${icon}</span>
            <h3 class="cd-title">${escapeHtml(title)}</h3>
          </div>
          ${bodyHtml ? `<div class="cd-body">${bodyHtml}</div>` : ''}
          ${fieldsHtml}
          <div class="cd-error" aria-live="polite"></div>
          <div class="cd-actions">
            <button type="button" class="cd-btn cd-cancel">Vazgeç</button>
            <button type="submit" class="cd-btn cd-confirm cd-primary">${escapeHtml(confirmText)}</button>
          </div>
        </form>`;
      document.body.appendChild(backdrop);
      requestAnimationFrame(() => backdrop.classList.add('cd-open'));

      const form = backdrop.querySelector('form');
      const errEl = backdrop.querySelector('.cd-error');
      const btnOk = backdrop.querySelector('.cd-confirm');
      let busy = false;
      setTimeout(() => { const first = form.querySelector('input:not([type=checkbox]), select'); if (first) first.focus(); }, 60);

      function close(result) {
        document.removeEventListener('keydown', onKey, true);
        backdrop.classList.remove('cd-open');
        setTimeout(() => backdrop.remove(), 160);
        resolve(result);
      }
      function onKey(e) {
        if (e.key === 'Escape' && !busy) { e.preventDefault(); close(false); }
      }
      document.addEventListener('keydown', onKey, true);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (busy) return;
        busy = true;
        btnOk.disabled = true;
        errEl.textContent = '';
        let err = '';
        try { err = await onSubmit(form); } catch (ex) { err = ex.message || 'İşlem başarısız.'; }
        busy = false;
        btnOk.disabled = false;
        if (err) { errEl.textContent = err; return; }
        close(true);
      });
      const selectAll = form.querySelector('.fd-select-all');
      if (selectAll) {
        selectAll.addEventListener('click', () => {
          const boxes = [...form.querySelectorAll('.fd-items input[type=checkbox]')];
          const allOn = boxes.every((b) => b.checked);
          boxes.forEach((b) => { b.checked = !allOn; });
        });
      }
      backdrop.querySelector('.cd-cancel').addEventListener('click', () => { if (!busy) close(false); });
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop && !busy) close(false); });
    });
  }

  async function openCreateUser() {
    const ok = await openFormDialog({
      icon: '👤',
      title: 'Yeni Kullanıcı',
      bodyHtml: '<p>Kullanıcı bu e-posta ve şifre ile hemen giriş yapabilir.</p>',
      fieldsHtml: `
        <label class="cd-label" for="fd-email">E-posta</label>
        <input class="cd-input" id="fd-email" name="email" type="email" placeholder="ornek@eposta.com" autocapitalize="off" spellcheck="false">
        <label class="cd-label" for="fd-password">Şifre</label>
        <input class="cd-input" id="fd-password" name="password" type="text" placeholder="En az 6 karakter" autocapitalize="off" spellcheck="false">
        <label class="fd-check"><input type="checkbox" name="verified" checked> E-postayı doğrulanmış say</label>`,
      confirmText: 'Kullanıcı Oluştur',
      onSubmit: async (form) => {
        const email = form.email.value.trim();
        const password = form.password.value;
        if (!email) return 'Bir e-posta girin.';
        if (password.length < 6) return 'Şifre en az 6 karakter olmalıdır.';
        const data = await api('/api/admin/users', {
          method: 'POST',
          body: JSON.stringify({ email, password, isVerified: form.verified.checked })
        });
        users.unshift(data.user);
        return '';
      }
    });
    if (ok) {
      render();
      toast('Kullanıcı oluşturuldu.');
    }
  }

  async function openTransfer(fromId, type, onlyItemId) {
    const from = users.find((u) => u.id === fromId);
    const d = detailCache.get(fromId);
    if (!from || !d) return;
    const isBoard = type === 'board';
    const items = isBoard ? d.boards : d.teams;
    const targets = users.filter((u) => u.id !== fromId);
    const noun = isBoard ? 'skorboard' : 'takım';

    const itemsHtml = items.map((it) => `
      <label><input type="checkbox" name="item" value="${escapeHtml(it.id)}" ${!onlyItemId || onlyItemId === it.id ? 'checked' : ''}>
        <span>${isBoard ? boardLabel(it) : teamLabel(it)}</span></label>`).join('');
    const optionsHtml = targets.map((u) => `<option value="${u.id}">${escapeHtml(u.email)}${u.isDisabled ? ' (askıda)' : ''}</option>`).join('');

    let result = null;
    let toId = null;
    const ok = await openFormDialog({
      icon: isBoard ? '↪' : '⧉',
      title: isBoard ? 'Skorboard Aktar' : 'Takım Kopyala',
      bodyHtml: isBoard
        ? `<p><b>${escapeHtml(from.email)}</b> hesabındaki seçili skorboardlar başka bir kullanıcıya taşınır. Skorboard kodu, yayın ve operatör bağlantıları değişmez.</p>`
        : `<p><b>${escapeHtml(from.email)}</b> hesabındaki seçili takımların bir kopyası (logo ve renklerle) başka bir kullanıcıya eklenir. Takımlar bu hesapta da kalır.</p>`,
      fieldsHtml: `
        <div class="detail-head" style="margin-top: 14px;">
          <span class="cd-label" style="margin: 0;">${isBoard ? 'Skorboardlar' : 'Takımlar'}</span>
          ${items.length > 1 ? '<button type="button" class="fd-select-all">Tümünü seç / kaldır</button>' : ''}
        </div>
        <div class="fd-items">${itemsHtml}</div>
        <label class="cd-label" for="fd-target">${isBoard ? 'Aktarılacak' : 'Kopyalanacak'} kullanıcı</label>
        <select class="cd-input" id="fd-target" name="target">${optionsHtml}</select>`,
      confirmText: isBoard ? 'Aktar' : 'Kopyala',
      onSubmit: async (form) => {
        const ids = [...form.querySelectorAll('input[name=item]:checked')].map((c) => c.value);
        if (!ids.length) return `En az bir ${noun} seçin.`;
        toId = form.target.value;
        result = await api('/api/admin/transfer', {
          method: 'POST',
          body: JSON.stringify({ type, ids, toUserId: form.target.value })
        });
        return '';
      }
    });
    if (!ok) return;

    // Counts and detail lists for both users are refreshed from the server
    detailCache.delete(fromId);
    detailCache.delete(toId);
    await loadUsers();
    const reloads = [fromId, toId].filter((id) => expanded.has(id));
    await Promise.all(reloads.map(async (id) => detailCache.set(id, await api(`/api/admin/users/${id}`))));
    render();
    toast(isBoard
      ? `${result.moved} skorboard ${result.email} hesabına aktarıldı.`
      : `${result.copied} takım ${result.email} hesabına kopyalandı.`);
  }

  function render() {
    renderStats();
    const list = filteredUsers();
    const el = document.getElementById('user-list');
    if (!list.length) {
      el.innerHTML = '<div class="empty-state">Eşleşen kullanıcı yok.</div>';
      return;
    }
    el.innerHTML = list.map((u) => {
      const isMe = u.id === currentUserId;
      const protectedUser = isMe || u.isAdmin;
      const badges = [
        u.isAdmin ? '<span class="badge badge-admin">Yönetici</span>' : '',
        isMe ? '<span class="badge badge-me">Sen</span>' : '',
        u.isDisabled ? '<span class="badge badge-off">Askıda</span>'
          : (u.isVerified ? '<span class="badge badge-ok">Doğrulandı</span>' : '<span class="badge badge-warn">Doğrulanmadı</span>')
      ].join('');
      return `
        <div class="user-item ${u.isDisabled ? 'disabled' : ''} ${expanded.has(u.id) ? 'expanded' : ''}" data-id="${u.id}">
          <div class="user-row">
            <div>
              <div class="user-email">${escapeHtml(u.email)} ${badges}</div>
              <div class="user-meta">
                <span>📅 Kayıt: ${formatDate(u.createdAt)}</span>
                <span>🔑 Son giriş: ${formatDate(u.lastLoginAt)}</span>
                <span>🏐 ${u.boardCount} skorboard</span>
                <span>🎽 ${u.teamCount} takım</span>
                <span>💻 ${u.sessionCount} oturum</span>
              </div>
            </div>
            <div class="user-actions">
              <button class="act-btn" data-act="detail">${expanded.has(u.id) ? '▲ Gizle' : '▼ Detay'}</button>
              ${u.isVerified ? '' : '<button class="act-btn" data-act="verify">✅ Doğrula</button>'}
              <button class="act-btn" data-act="password">🔒 Şifre</button>
              <button class="act-btn" data-act="logout" ${u.sessionCount ? '' : 'disabled'}>🚪 Oturumları Kapat</button>
              <button class="act-btn" data-act="toggle-disable" ${protectedUser ? 'disabled title="Yönetici hesabı"' : ''}>${u.isDisabled ? '▶️ Etkinleştir' : '⏸️ Askıya Al'}</button>
              <button class="act-btn danger" data-act="delete" ${protectedUser ? 'disabled title="Yönetici hesabı"' : ''}>🗑️ Sil</button>
            </div>
          </div>
          <div class="user-detail">${expanded.has(u.id) ? renderDetail(u.id) : ''}</div>
        </div>`;
    }).join('');
  }

  function replaceUser(updated) {
    if (!updated) return;
    const i = users.findIndex((u) => u.id === updated.id);
    if (i !== -1) users[i] = updated;
  }

  async function handleAction(id, act, itemId) {
    const u = users.find((x) => x.id === id);
    if (!u) return;
    const email = `<b>${escapeHtml(u.email)}</b>`;

    try {
      if (act === 'transfer-board' || act === 'transfer-team') {
        await openTransfer(id, act === 'transfer-board' ? 'board' : 'team', itemId);
        return;
      }

      if (act === 'detail') {
        if (expanded.has(id)) { expanded.delete(id); render(); return; }
        expanded.add(id);
        render();
        const data = await api(`/api/admin/users/${id}`);
        detailCache.set(id, data);
        render();
        return;
      }

      if (act === 'verify') {
        const data = await api(`/api/admin/users/${id}`, { method: 'PUT', body: JSON.stringify({ isVerified: true }) });
        replaceUser(data.user);
        render();
        toast('Hesap doğrulandı.');
        return;
      }

      if (act === 'password') {
        const pwd = await appPrompt({
          icon: '🔒',
          title: 'Yeni Şifre Belirle',
          bodyHtml: `<p>${email} için yeni bir şifre girin. Kullanıcının açık oturumları kapatılır.</p>`,
          label: 'Yeni şifre',
          placeholder: 'En az 6 karakter',
          emptyText: 'Bir şifre girin.',
          confirmText: 'Şifreyi Kaydet',
          validate: async (v) => (v.length < 6 ? 'Şifre en az 6 karakter olmalıdır.' : '')
        });
        if (pwd == null) return;
        const data = await api(`/api/admin/users/${id}`, { method: 'PUT', body: JSON.stringify({ password: pwd }) });
        replaceUser(data.user);
        render();
        toast('Şifre güncellendi.');
        return;
      }

      if (act === 'logout') {
        const ok = await appConfirm({
          icon: '🚪',
          title: 'Oturumları Kapat',
          bodyHtml: `<p>${email} tüm cihazlardan çıkış yapacak.${id === currentUserId ? ' <b>Bu sizin hesabınız; siz de çıkış yapacaksınız.</b>' : ''}</p>`,
          confirmText: 'Oturumları Kapat'
        });
        if (!ok) return;
        await api(`/api/admin/users/${id}/logout`, { method: 'POST' });
        if (id === currentUserId) { window.location.href = '/login'; return; }
        await loadUsers();
        toast('Oturumlar kapatıldı.');
        return;
      }

      if (act === 'toggle-disable') {
        const disable = !u.isDisabled;
        const ok = await appConfirm({
          icon: disable ? '⏸️' : '▶️',
          title: disable ? 'Hesabı Askıya Al' : 'Hesabı Etkinleştir',
          bodyHtml: disable
            ? `<p>${email} giriş yapamayacak ve açık oturumları kapatılacak. Skorboardları ve yayın bağlantıları silinmez.</p>`
            : `<p>${email} yeniden giriş yapabilecek.</p>`,
          confirmText: disable ? 'Askıya Al' : 'Etkinleştir',
          tone: disable ? 'danger' : 'primary'
        });
        if (!ok) return;
        const data = await api(`/api/admin/users/${id}`, { method: 'PUT', body: JSON.stringify({ isDisabled: disable }) });
        replaceUser(data.user);
        render();
        toast(disable ? 'Hesap askıya alındı.' : 'Hesap etkinleştirildi.');
        return;
      }

      if (act === 'delete') {
        const ok = await appConfirm({
          icon: '🗑️',
          title: 'Kullanıcıyı Sil',
          bodyHtml: `<p>${email} kalıcı olarak silinecek.</p>
            <p>Birlikte silinecekler: <b>${u.boardCount} skorboard</b>, <b>${u.teamCount} takım</b> ve yüklenen logolar. Bu işlem geri alınamaz.</p>`,
          confirmText: 'Kalıcı Olarak Sil',
          tone: 'danger'
        });
        if (!ok) return;
        await api(`/api/admin/users/${id}`, { method: 'DELETE' });
        users = users.filter((x) => x.id !== id);
        expanded.delete(id);
        detailCache.delete(id);
        render();
        toast('Kullanıcı silindi.');
      }
    } catch (err) {
      toast(err.message, true);
    }
  }

  document.getElementById('user-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.act-btn');
    if (!btn || btn.disabled) return;
    const item = btn.closest('.user-item');
    handleAction(item.dataset.id, btn.dataset.act, btn.dataset.item);
  });
  document.getElementById('btn-create-user').addEventListener('click', openCreateUser);
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filter').addEventListener('change', render);

  loadUsers();
</script>
<script src="/js/theme.js"></script>
</body>
</html>
