<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voleybol Skorcu Kumandası</title>
  <link rel="stylesheet" href="/css/common.css?v=1.2.0">
  <link rel="stylesheet" href="/css/control.css?v=1.2.0">
  <link rel="icon" href="/assets/volleyball.svg">
  <script>
  (function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}else{var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light')}})();
  </script>
  <style>
    .op-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="control-container">
  <!-- Header -->
  <header class="control-header">
    <div>
      <div class="match-info-title" id="match-title">Yükleniyor...</div>
      <div class="match-info-sub" id="match-sub">Canlı Skor Girişi</div>
    </div>
    <div class="flex-center" style="gap: 10px;">
      <span class="op-badge">📱 SKORCU EKRANI</span>
      <button class="theme-toggle" onclick="toggleTheme()" title="Tema Değiştir" aria-label="Tema Değiştir">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </button>
      <div class="conn-indicator">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-text">Bağlanıyor...</span>
      </div>
    </div>
  </header>

  <!-- Status Ribbon & Set History -->
  <div class="status-ribbon">
    <div class="flex-center" style="gap: 12px;">
      <span class="set-pill" id="set-pill">1. SET</span>

      <!-- Set Clock -->
      <div class="set-clock">
        <span class="set-clock-val" id="set-clock-val">00:00</span>
        <button class="clock-btn" id="btn-clock-play" title="Başlat" aria-label="Set sayacını başlat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="clock-btn" id="btn-clock-toggle" title="Duraklat" aria-label="Set sayacını duraklat">
          <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg>
          <svg class="ic-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
        </button>
      </div>
    </div>
    <div class="set-history-pills" id="history-list">
      <!-- Past set scores will appear here -->
    </div>
  </div>

  <!-- Timeout Alert Banner -->
  <div class="timeout-banner" id="timeout-banner">
    <div class="flex-center" style="gap: 10px;">
      <span style="font-size: 1.5rem;">⏱️</span>
      <span id="timeout-banner-text">MOLA KULLANILIYOR</span>
    </div>
    <div class="flex-center" style="gap: 12px;">
      <span class="timeout-timer-val" id="timeout-val">30</span>
      <button class="btn-action-main" id="btn-end-timeout" style="padding: 4px 10px; font-size: 0.75rem; background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.4);">
        Bitir
      </button>
    </div>
  </div>

  <!-- Main Teams Grid -->
  <div class="teams-grid">
    <!-- TEAM A (HOME) -->
    <div class="team-card" id="team-card-a">
      <div class="team-card-header">
        <div class="team-logo-title">
          <img src="/assets/fenerbahce.svg" class="team-logo-img" id="team-a-logo" alt="Logo">
          <div>
            <div class="team-name-text" id="team-a-name">FENERBAHÇE</div>
            <div class="team-short-code" id="team-a-short">FB</div>
          </div>
        </div>
        <div class="sets-badge" id="team-a-sets">0 SET</div>
      </div>

      <!-- Service & Timeouts Row -->
      <div class="sub-indicators">
        <button class="serve-btn" id="btn-serve-a">
          <img src="/assets/volleyball.svg" class="volleyball-icon-mini" alt="Top">
          <span>SERVİS</span>
        </button>

        <div class="timeouts-tracker-col">
          <div class="to-countdown-badge" id="to-countdown-a" style="display: none;">30s</div>
          <div class="timeouts-tracker">
            <span>MOLA:</span>
            <div class="to-dot" id="to-a-1"></div>
            <div class="to-dot" id="to-a-2"></div>
          </div>
        </div>
      </div>

      <!-- GIANT POINT TAP AREA (+1) -->
      <div class="point-tap-area" id="btn-point-a">
        <div class="point-display" id="team-a-points">0</div>
        <div class="point-tap-label">SAYI EKLE (+1)</div>
      </div>

      <!-- Quick Actions: -1 Point & Call Timeout -->
      <div class="team-action-row">
        <button class="btn-sub-point" id="btn-sub-a">-1 Sayı Düş</button>
        <button class="btn-timeout-call" id="btn-timeout-a">⏱️ Mola Al</button>
      </div>
    </div>

    <!-- TEAM B (AWAY) -->
    <div class="team-card" id="team-card-b">
      <div class="team-card-header">
        <div class="team-logo-title">
          <img src="/assets/opponent.svg" class="team-logo-img" id="team-b-logo" alt="Logo">
          <div>
            <div class="team-name-text" id="team-b-name">RAKİP TAKIM</div>
            <div class="team-short-code" id="team-b-short">RAK</div>
          </div>
        </div>
        <div class="sets-badge" id="team-b-sets">0 SET</div>
      </div>

      <!-- Service & Timeouts Row -->
      <div class="sub-indicators">
        <button class="serve-btn" id="btn-serve-b">
          <img src="/assets/volleyball.svg" class="volleyball-icon-mini" alt="Top">
          <span>SERVİS</span>
        </button>

        <div class="timeouts-tracker-col">
          <div class="to-countdown-badge" id="to-countdown-b" style="display: none;">30s</div>
          <div class="timeouts-tracker">
            <span>MOLA:</span>
            <div class="to-dot" id="to-b-1"></div>
            <div class="to-dot" id="to-b-2"></div>
          </div>
        </div>
      </div>

      <!-- GIANT POINT TAP AREA (+1) -->
      <div class="point-tap-area" id="btn-point-b">
        <div class="point-display" id="team-b-points">0</div>
        <div class="point-tap-label">SAYI EKLE (+1)</div>
      </div>

      <!-- Quick Actions: -1 Point & Call Timeout -->
      <div class="team-action-row">
        <button class="btn-sub-point" id="btn-sub-b">-1 Sayı Düş</button>
        <button class="btn-timeout-call" id="btn-timeout-b">⏱️ Mola Al</button>
      </div>
    </div>
  </div>

  <!-- Bottom Global Controls -->
  <div class="bottom-controls">
    <button class="btn-action-main btn-undo" id="btn-undo">
      <span style="font-size: 1.2rem;">↩️</span>
      <span>Geri Al (Undo)</span>
    </button>
    <button class="btn-action-main btn-swap" id="btn-swap">
      <span style="font-size: 1.2rem;">🔄</span>
      <span>Saha Değiş</span>
    </button>
    <button class="btn-action-main btn-end-set" id="btn-end-set">
      <span style="font-size: 1.2rem;">🏁</span>
      <span>Seti Bitir</span>
    </button>
    <button class="btn-action-main" id="btn-new-set">
      <span style="font-size: 1.2rem;">▶️</span>
      <span>Yeni Set</span>
    </button>
  </div>
</div>

<!-- Toast Feedback Container -->
<div class="toast-container" id="toast-container"></div>

<script src="/js/operate.js?v=1.2.0"></script>
<script src="/js/theme.js"></script>
</body>
</html>
