<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Voleybol Skorcu Kumandası</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a2846">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Skorcu">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/common.css?v=1.3.1">
  <link rel="stylesheet" href="/css/control.css?v=1.3.1">
  <link rel="stylesheet" href="/css/operate.css?v=1.7.0">
  <link rel="icon" href="/assets/volleyball.svg">
  <script>
  (function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}else{var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light')}})();
  </script>
  <style>
    .op-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="operate-page">

<div class="control-container">
  <!-- Status Ribbon & Set History -->
  <div class="status-ribbon">
    <div class="flex-center" style="gap: 12px;">
      <span class="set-pill" id="set-pill">1. SET</span>

      <!-- Set Clock -->
      <div class="set-clock">
        <span class="set-clock-val" id="set-clock-val">00:00</span>
        <button class="clock-btn" id="btn-clock-play" title="Başlat" aria-label="Set sayacını başlat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="clock-btn" id="btn-clock-toggle" title="Duraklat" aria-label="Set sayacını duraklat">
          <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg>
          <svg class="ic-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
        </button>
      </div>
    </div>
    <div class="set-history-pills" id="history-list">
      <!-- Past set scores will appear here -->
    </div>
    <button class="op-gear" id="btn-op-settings" title="Ayarlar" aria-label="Ayarlar">
      <span aria-hidden="true">⚙️</span>
      <span class="gear-dot" id="gear-dot"></span>
    </button>
  </div>

  <!-- Timeout Active Banner -->
  <div class="timeout-banner" id="timeout-banner">
    <div>
      <span style="font-size: 0.85rem; opacity: 0.9;">⏳ MOLA DEVAM EDİYOR</span>
      <div id="timeout-team-name" style="font-size: 1.1rem; font-weight: 800;">Mola</div>
    </div>
    <div class="flex-center" style="gap: 12px;">
      <div class="timeout-timer-val" id="timeout-timer">30s</div>
      <button id="btn-end-timeout" style="background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; border-radius: 4px; font-weight: 700; cursor: pointer;">
        Molayı Bitir
      </button>
    </div>
  </div>

  <!-- Main Teams Scoreboard Cards Grid -->
  <div class="teams-grid">
    <!-- Left Team Card -->
    <div class="team-card" id="left-team-card">
      <div class="team-card-header">
        <div class="team-logo-title">
          <img src="/assets/volleyball.svg" alt="Logo" class="team-logo-img" id="left-team-logo">
          <div>
            <div class="team-name-text" id="left-team-name">EV SAHİBİ</div>
            <div class="team-short-code" id="left-team-short">EV</div>
          </div>
        </div>
        <div class="sets-badge" id="left-sets-badge">0 Set</div>
      </div>

      <div class="sub-indicators">
        <button class="serve-btn is-serving" id="left-serve-btn">
          <img src="/assets/volleyball.svg" class="volleyball-icon-mini" alt="Serve">
          <span>SERVİS</span>
        </button>
        <div class="timeouts-tracker-col">
          <span class="to-countdown-badge" id="left-to-badge" style="display: none;">30s</span>
          <div class="timeouts-tracker">
            <span>Mola:</span>
            <div class="to-dot" id="left-to-dot-1"></div>
            <div class="to-dot" id="left-to-dot-2"></div>
          </div>
        </div>
      </div>

      <div class="point-tap-area" id="left-point-area">
        <div class="point-display" id="left-point-val">0</div>
        <div class="point-tap-label">+1 SAYI</div>
      </div>

      <div class="team-action-row">
        <button class="btn-sub-point" id="left-sub-point">-1 Sayı</button>
        <button class="btn-timeout-call" id="left-timeout-btn">⏱️ Mola Al</button>
      </div>
    </div>

    <!-- Right Team Card -->
    <div class="team-card" id="right-team-card">
      <div class="team-card-header">
        <div class="team-logo-title">
          <img src="/assets/volleyball.svg" alt="Logo" class="team-logo-img" id="right-team-logo">
          <div>
            <div class="team-name-text" id="right-team-name">DEPLASMAN</div>
            <div class="team-short-code" id="right-team-short">DEP</div>
          </div>
        </div>
        <div class="sets-badge" id="right-sets-badge">0 Set</div>
      </div>

      <div class="sub-indicators">
        <button class="serve-btn" id="right-serve-btn">
          <img src="/assets/volleyball.svg" class="volleyball-icon-mini" alt="Serve">
          <span>SERVİS</span>
        </button>
        <div class="timeouts-tracker-col">
          <span class="to-countdown-badge" id="right-to-badge" style="display: none;">30s</span>
          <div class="timeouts-tracker">
            <span>Mola:</span>
            <div class="to-dot" id="right-to-dot-1"></div>
            <div class="to-dot" id="right-to-dot-2"></div>
          </div>
        </div>
      </div>

      <div class="point-tap-area" id="right-point-area">
        <div class="point-display" id="right-point-val">0</div>
        <div class="point-tap-label">+1 SAYI</div>
      </div>

      <div class="team-action-row">
        <button class="btn-sub-point" id="right-sub-point">-1 Sayı</button>
        <button class="btn-timeout-call" id="right-timeout-btn">⏱️ Mola Al</button>
      </div>
    </div>
  </div>

  <!-- Bottom Global Actions Bar -->
  <div class="bottom-controls">
    <button class="btn-action-main btn-undo" id="btn-undo">
      <span style="font-size: 1.2rem;">↩️</span>
      <span>Geri Al (Undo)</span>
    </button>
    <button class="btn-action-main btn-swap" id="btn-swap">
      <span style="font-size: 1.2rem;">🔄</span>
      <span>Saha Değiş</span>
    </button>
    <button class="btn-action-main btn-end-set" id="btn-end-set">
      <span style="font-size: 1.2rem;">🏁</span>
      <span>Seti Bitir</span>
    </button>
    <button class="btn-action-main" id="btn-show-history">
      <span style="font-size: 1.2rem;">📊</span>
      <span>Geçmişi Göster</span>
    </button>
    <button class="btn-action-main" id="btn-show-result">
      <span style="font-size: 1.2rem;">🏆</span>
      <span>Maç Sonucu</span>
    </button>
  </div>
</div>

<!-- Ayarlar paneli: maç bilgisi, bağlantı, maç kodu, tema -->
<div class="modal-backdrop" id="modal-op-settings">
  <div class="modal-box op-settings-box">
    <div class="flex-between" style="margin-bottom: 14px; align-items: flex-start;">
      <div style="min-width: 0;">
        <div class="match-info-title" id="match-title">Yükleniyor...</div>
        <div class="match-info-sub" id="match-sub">Canlı Skor Girişi</div>
      </div>
      <button class="btn-modal-close" id="btn-close-op-settings" aria-label="Kapat">&times;</button>
    </div>

    <div class="op-set-row">
      <span>Bağlantı</span>
      <div class="conn-indicator">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-text">Bağlanıyor...</span>
      </div>
    </div>
    <div class="op-set-row">
      <span>Maç kodu</span>
      <button class="code-switch-btn" id="btn-change-code" title="Maç kodunu değiştir" aria-label="Maç kodunu değiştir">
        <span aria-hidden="true">🔁</span>
        <span id="code-label">Kod</span>
      </button>
    </div>
    <div class="op-set-row">
      <span>Tema</span>
      <button class="theme-toggle" onclick="toggleTheme()" title="Tema Değiştir" aria-label="Tema Değiştir">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast Feedback Container -->
<div class="toast-container" id="toast-container"></div>

<script src="/js/operate.js?v=1.9.0"></script>
<script src="/js/confirm-dialog.js?v=1.2.0"></script>
<script src="/js/theme.js"></script>
</body>
</html>
