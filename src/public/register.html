<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol - Voleybol Skorboard</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="icon" href="/assets/volleyball.svg">
  <script>
  (function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}else{var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light')}})();
  </script>
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, var(--auth-gradient-from) 0%, var(--auth-gradient-to) 100%);
      position: relative;
    }
    .auth-top-bar {
      position: absolute;
      top: 20px;
      right: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--auth-card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      text-decoration: none;
    }
    .auth-brand img {
      width: 36px;
      height: 36px;
    }
    .auth-brand span {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--text-heading);
      letter-spacing: -0.5px;
    }
    .auth-brand span span {
      color: var(--fb-yellow);
    }
    .auth-title {
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-heading);
    }
    .auth-desc {
      font-size: 0.9rem;
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--fb-yellow);
      box-shadow: 0 0 0 3px var(--accent-yellow-border);
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--fb-yellow);
      color: var(--btn-primary-text);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      background: var(--fb-yellow-hover);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--fb-yellow);
      text-decoration: none;
      font-weight: 700;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .alert-box {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-top-bar">
    <button class="theme-toggle" onclick="toggleTheme()" title="Tema Değiştir" aria-label="Tema Değiştir">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
  </div>

  <div class="auth-card">
    <a href="/" class="auth-brand">
      <img src="/assets/volleyball.svg" alt="Logo">
      <span>Voleybol<span>Skor</span></span>
    </a>

    <h1 class="auth-title">Yeni Hesap Oluşturun</h1>
    <p class="auth-desc">Kendi skorboardlarınızı ve takımlarınızı oluşturun</p>

    <div class="alert-box alert-error" id="alert-box"></div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="email">E-posta Adresi</label>
        <input type="email" id="email" class="form-input" placeholder="ornek@kulup.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Şifre (En az 6 karakter)</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="6" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password-confirm">Şifre Tekrarı</label>
        <input type="password" id="password-confirm" class="form-input" placeholder="••••••••" minlength="6" required>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Kayıt Ol</button>
    </form>

    <div class="auth-footer">
      Zaten hesabınız var mı? <a href="/login">Giriş Yapın</a>
    </div>
  </div>
</div>

<script src="/js/theme.js"></script>
<script>
  const form = document.getElementById('register-form');
  const alertBox = document.getElementById('alert-box');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('password-confirm').value;

    if (password !== confirm) {
      alertBox.textContent = 'Girdiğiniz şifreler birbiriyle uyuşmuyor.';
      alertBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Kayıt yapılıyor...';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        alertBox.textContent = data.error || 'Kayıt başarısız oldu.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Kayıt Ol';
        return;
      }

      // Success: redirect to verify page with email param
      window.location.href = `/verify?email=${encodeURIComponent(email)}`;
    } catch (err) {
      alertBox.textContent = 'Sunucuya bağlanılamadı. Lütfen tekrar deneyin.';
      alertBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kayıt Ol';
    }
  });
</script>

</body>
</html>
