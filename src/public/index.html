<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voleybol Canlı Skorboard & Yayın Paneli</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="icon" href="/assets/volleyball.svg">
  <script>
  (function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}else{var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light')}})();
  </script>
  <style>
    .home-container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 16px;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--text-heading);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .nav-brand span span {
      color: var(--fb-yellow);
    }
    .nav-brand img {
      width: 32px;
      height: 32px;
    }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .user-pill {
      background: var(--overlay-bg);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      border: 1px solid var(--border-color);
      background: var(--overlay-bg);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav:hover {
      background: var(--overlay-hover);
      border-color: var(--overlay-border-strong);
    }
    .btn-nav-primary {
      background: var(--fb-yellow);
      color: var(--btn-primary-text);
      border: none;
    }
    .btn-nav-primary:hover {
      background: var(--fb-yellow-hover);
    }
    .btn-logout {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }
    .btn-logout:hover {
      background: var(--error-border);
    }
    .hero-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .hero-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-heading);
      margin-bottom: 4px;
    }
    .hero-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    /* Boards List View */
    .board-search-input {
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      width: 240px;
      transition: border-color 0.2s;
    }
    .board-search-input:focus {
      border-color: var(--fb-yellow);
    }
    .boards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .board-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .board-item:hover {
      border-color: var(--accent-yellow-border);
    }
    .board-item.expanded {
      border-color: var(--fb-yellow);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }
    .board-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      gap: 16px;
      transition: background-color 0.15s;
    }
    .board-item-header:hover {
      background: var(--overlay-subtle);
    }
    .board-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
      flex: 1 1 auto;
    }
    .board-expand-indicator {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: var(--overlay-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.72rem;
      transition: transform 0.2s ease, background 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .board-item.expanded .board-expand-indicator {
      transform: rotate(90deg);
      background: var(--accent-yellow-bg);
      color: var(--fb-yellow);
      border-color: var(--accent-yellow-border);
    }
    .board-title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .board-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .board-item-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-heading);
      line-height: 1.25;
    }
    .board-code-badge {
      font-size: 0.74rem;
      font-weight: 700;
      font-family: monospace;
      background: var(--overlay-bg);
      border: 1px solid var(--border-color);
      color: var(--text-tertiary);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .board-item-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Middle / Match Preview */
    .board-header-match {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: var(--bg-card-alt);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      flex-shrink: 0;
    }
    .mini-team {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--text-main);
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-team-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .board-score-badge {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--fb-yellow);
      background: var(--accent-yellow-bg);
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .board-score-points {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-left: 2px;
    }

    /* Right / Meta & Quick Actions */
    .board-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .board-date-badge {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      white-space: nowrap;
    }
    .board-date-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--text-tertiary);
    }
    .board-date-value {
      font-weight: 700;
      color: var(--text-secondary);
    }
    .board-quick-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Details Panel */
    .board-details-panel {
      display: none;
      border-top: 1px solid var(--border-color);
      padding: 20px;
      background: var(--bg-card-alt);
    }
    .board-item.expanded .board-details-panel {
      display: block;
      animation: fadeInDetails 0.2s ease-out;
    }
    @keyframes fadeInDetails {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .match-full-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 14px;
    }
    .match-full-team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 800;
    }
    .match-full-team img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .match-full-center {
      text-align: center;
    }
    .match-full-sets {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--fb-yellow);
      letter-spacing: 1px;
    }
    .match-full-points {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .match-status-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      background: var(--overlay-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      margin-top: 4px;
    }
    .match-status-pill.live {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .details-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
    }
    .links-accordion-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--overlay-subtle);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      gap: 8px;
    }
    .link-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-action-sm {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 0.76rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--border-color);
      background: var(--overlay-bg);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-action-sm:hover {
      background: var(--overlay-hover);
    }
    .btn-action-sm.btn-primary {
      background: var(--fb-yellow);
      color: var(--btn-primary-text);
      border: none;
    }
    .btn-action-sm.btn-primary:hover {
      background: var(--fb-yellow-hover);
    }
    .btn-action-sm.btn-op {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }
    .btn-action-sm.btn-op:hover {
      background: var(--success-border);
    }
    .btn-delete-board {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .btn-delete-board:hover {
      color: var(--error-text);
      background: var(--error-bg);
    }

    @media (max-width: 900px) {
      .details-grid {
        grid-template-columns: 1fr;
      }
      .board-item-header {
        flex-direction: column;
        align-items: stretch;
      }
      .board-header-right {
        justify-content: space-between;
        width: 100%;
      }
      .board-date-badge {
        align-items: flex-start;
      }
      .board-header-match {
        justify-content: center;
      }
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 16px;
      grid-column: 1 / -1;
    }
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .empty-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-heading);
      margin-bottom: 6px;
    }
    .empty-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
      max-width: 480px;
      margin: 0 auto 20px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--modal-backdrop);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-md);
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-heading);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }
    .modal-group {
      margin-bottom: 14px;
    }
    .modal-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .modal-input, .modal-select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      box-sizing: border-box;
    }
    .modal-input:focus, .modal-select:focus {
      border-color: var(--fb-yellow);
    }
    .modal-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
  </style>
</head>
<body>

<div class="home-container">
  <!-- Top Nav -->
  <header class="top-nav">
    <a href="/" class="nav-brand">
      <img src="/assets/volleyball.svg" alt="Logo">
      <span>Voleybol<span>Skor</span></span>
    </a>
    <div class="nav-user" id="nav-user-section">
      <span class="user-pill" id="user-email-pill">👤 Yükleniyor...</span>
      <button class="theme-toggle" onclick="toggleTheme()" title="Tema Değiştir" aria-label="Tema Değiştir">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </button>
      <a href="/teams" class="btn-nav">🏐 Takımlar</a>
      <button class="btn-nav btn-nav-primary" id="btn-new-board">+ Yeni Skorboard</button>
      <button class="btn-nav btn-logout" id="btn-logout">Çıkış Yap</button>
    </div>
  </header>

  <!-- Hero / Header -->
  <div class="hero-section">
    <div>
      <h1 class="hero-title">Skorboardlarım</h1>
      <p class="hero-desc">Yayınlarınız ve maçlarınız için canlı skorboard panelleriniz (Açılış tarihine göre sıralı)</p>
    </div>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <input type="text" id="board-search-input" class="board-search-input" placeholder="🔍 Skorboard veya takım ara..." oninput="filterBoards(this.value)">
      <button class="btn-nav btn-nav-primary" id="btn-hero-new">+ Yeni Skorboard Ekle</button>
    </div>
  </div>

  <!-- Boards List -->
  <div class="boards-list" id="boards-list">
    <!-- Populated by JS -->
  </div>
</div>

<!-- New Board Modal -->
<div class="modal-backdrop" id="modal-new-board">
  <div class="modal-card">
    <div class="modal-title">
      <span>🏐 Yeni Skorboard Oluştur</span>
      <button class="modal-close" id="btn-close-modal">&times;</button>
    </div>
    <form id="form-create-board">
      <div class="modal-group">
        <label class="modal-label" for="board-title">Maç / Lig Başlığı</label>
        <input type="text" id="board-title" class="modal-input" placeholder="Örn: Genç Erkekler Voleybol Ligi" required>
      </div>

      <div class="modal-group">
        <label class="modal-label" for="board-subtitle">Alt Başlık</label>
        <input type="text" id="board-subtitle" class="modal-input" placeholder="Örn: Canlı Yayın">
      </div>

      <div class="modal-group">
        <label class="modal-label" for="board-preset">Tasarım & Renk Şablonu</label>
        <select id="board-preset" class="modal-select">
          <option value="fenerbahce">Fenerbahçe Sarı-Lacivert Şablonu</option>
          <option value="generic">Genel Voleybol (Mavi / Kırmızı) Şablonu</option>
        </select>
      </div>

      <!-- 1. TAKIM (EV SAHİBİ) -->
      <div style="margin-top: 14px; margin-bottom: 6px; font-weight: 800; font-size: 0.85rem; color: var(--fb-yellow, #ffed00);">
        1. TAKIM (EV SAHİBİ)
      </div>
      <div class="modal-group">
        <label class="modal-label" for="select-team-a">Kayıtlı Takımlardan Seç (İsteğe Bağlı)</label>
        <select id="select-team-a" class="modal-select">
          <option value="">-- Kayıtlı Takımlardan Seç (veya aşağıdan elle girin) --</option>
        </select>
      </div>
      <div class="modal-row">
        <div class="modal-group">
          <label class="modal-label" for="team-a-name">Takım Adı</label>
          <input type="text" id="team-a-name" class="modal-input" placeholder="FENERBAHÇE" required>
        </div>
        <div class="modal-group">
          <label class="modal-label" for="team-a-short">Kısa Kod</label>
          <input type="text" id="team-a-short" class="modal-input" placeholder="FB" maxlength="5">
        </div>
      </div>

      <!-- 2. TAKIM (DEPLASMAN) -->
      <div style="margin-top: 10px; margin-bottom: 6px; font-weight: 800; font-size: 0.85rem; color: #fca5a5;">
        2. TAKIM (DEPLASMAN)
      </div>
      <div class="modal-group">
        <label class="modal-label" for="select-team-b">Kayıtlı Takımlardan Seç (İsteğe Bağlı)</label>
        <select id="select-team-b" class="modal-select">
          <option value="">-- Kayıtlı Takımlardan Seç (veya aşağıdan elle girin) --</option>
        </select>
      </div>
      <div class="modal-row">
        <div class="modal-group">
          <label class="modal-label" for="team-b-name">Takım Adı</label>
          <input type="text" id="team-b-name" class="modal-input" placeholder="RAKİP TAKIM" required>
        </div>
        <div class="modal-group">
          <label class="modal-label" for="team-b-short">Kısa Kod</label>
          <input type="text" id="team-b-short" class="modal-input" placeholder="RAK" maxlength="5">
        </div>
      </div>

      <button type="submit" class="btn-nav btn-nav-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 8px;" id="btn-submit-board">
        Skorboardu Oluştur
      </button>
    </form>
  </div>
</div>

<script>
  let currentUser = null;
  let userTeams = [];
  let selectedTeamA = null;
  let selectedTeamB = null;
  const origin = window.location.origin;

  // Check Authentication
  async function checkAuth() {
    try {
      const res = await fetch('/api/auth/me');
      const data = await res.json();
      if (!data.authenticated || !data.user) {
        window.location.href = '/';
        return;
      }
      currentUser = data.user;
      document.getElementById('user-email-pill').textContent = `👤 ${currentUser.email}`;
      loadBoards();
      loadUserTeams();
    } catch (e) {
      window.location.href = '/';
    }
  }

  // Load User Teams for dropdowns
  async function loadUserTeams() {
    try {
      const res = await fetch('/api/teams');
      const data = await res.json();
      if (data.success && Array.isArray(data.teams)) {
        userTeams = data.teams;
        populateTeamSelects();
      }
    } catch (err) {
      console.error('Takımlar yüklenemedi:', err);
    }
  }

  function populateTeamSelects() {
    const selA = document.getElementById('select-team-a');
    const selB = document.getElementById('select-team-b');
    if (!selA || !selB) return;

    const defaultOpt = '<option value="">-- Kayıtlı Takımlardan Seç (veya aşağıdan elle girin) --</option>';
    const options = userTeams.map(t => `<option value="${t.id}">${escapeHtml(t.name)} ${t.shortName ? `(${escapeHtml(t.shortName)})` : ''}</option>`);

    selA.innerHTML = defaultOpt + options.join('');
    selB.innerHTML = defaultOpt + options.join('');
  }

  // Logout
  document.getElementById('btn-logout').addEventListener('click', async () => {
    try {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    } catch (e) {
      window.location.href = '/login';
    }
  });

  // Format creation date
  function formatCreatedDate(ts) {
    if (!ts) return 'Belirtilmemiş';
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return 'Belirtilmemiş';
    return d.toLocaleDateString('tr-TR', {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  // Toggle Accordion Details
  function toggleBoardDetails(id) {
    const item = document.getElementById(`board-item-${id}`);
    if (!item) return;
    item.classList.toggle('expanded');
  }

  // Filter Boards
  function filterBoards(query) {
    const q = (query || '').toLowerCase().trim();
    const items = document.querySelectorAll('.board-item');
    items.forEach(el => {
      const text = el.getAttribute('data-search') || '';
      if (!q || text.includes(q)) {
        el.style.display = '';
      } else {
        el.style.display = 'none';
      }
    });
  }

  // Load Boards
  async function loadBoards() {
    const listEl = document.getElementById('boards-list') || document.getElementById('boards-grid');
    listEl.innerHTML = '<div style="color: var(--text-muted); padding: 20px;">Skorboardlar yükleniyor...</div>';

    try {
      const res = await fetch('/api/boards');
      if (res.status === 401) {
        window.location.href = '/login';
        return;
      }
      const boards = await res.json();

      if (!Array.isArray(boards) || boards.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🏐</div>
            <div class="empty-title">Henüz Skorboardunuz Yok</div>
            <p class="empty-desc">Maçlarınızı yönetmek ve OBS yayınlarınıza eklemek için hemen ilk skorboardunuzu oluşturun.</p>
            <button class="btn-nav btn-nav-primary" onclick="openCreateModal()">+ İlk Skorboardu Oluştur</button>
          </div>
        `;
        return;
      }

      // Sort boards strictly by creation date DESC (newest first)
      boards.sort((a, b) => {
        const tA = Number(a.createdAt) || 0;
        const tB = Number(b.createdAt) || 0;
        return tB - tA;
      });

      listEl.innerHTML = boards.map(b => {
        const teamAName = b.teamA?.name || 'EV SAHİBİ';
        const teamBName = b.teamB?.name || 'DEPLASMAN';
        const teamAShort = b.teamA?.shortName || teamAName.slice(0, 3).toUpperCase();
        const teamBShort = b.teamB?.shortName || teamBName.slice(0, 3).toUpperCase();
        const setsWonA = b.teamA?.setsWon || 0;
        const setsWonB = b.teamB?.setsWon || 0;
        const ptsA = b.teamA?.points || 0;
        const ptsB = b.teamB?.points || 0;

        const logoA = b.teamA?.logo ? `<img src="${escapeHtml(b.teamA.logo)}" class="mini-team-logo" alt="">` : '🏐';
        const logoB = b.teamB?.logo ? `<img src="${escapeHtml(b.teamB.logo)}" class="mini-team-logo" alt="">` : '🏐';
        const fullLogoA = b.teamA?.logo ? `<img src="${escapeHtml(b.teamA.logo)}" style="width:36px;height:36px;object-fit:contain;border-radius:4px;" alt="">` : '🏐';
        const fullLogoB = b.teamB?.logo ? `<img src="${escapeHtml(b.teamB.logo)}" style="width:36px;height:36px;object-fit:contain;border-radius:4px;" alt="">` : '🏐';

        const createdDateStr = formatCreatedDate(b.createdAt);
        const searchKeywords = `${b.title || ''} ${b.subtitle || ''} ${b.id} ${teamAName} ${teamBName} ${teamAShort} ${teamBShort}`.toLowerCase();

        let statusText = 'HAZIR';
        let statusClass = '';
        if (b.status === 'live') {
          statusText = `CANLI (${b.currentSet || 1}. SET)`;
          statusClass = 'live';
        } else if (b.status === 'break') {
          statusText = 'SET ARASI';
        } else if (b.status === 'finished') {
          statusText = 'MAÇ BİTTİ';
        }

        const controlUrl = `${origin}/control/${b.id}`;
        const operateUrl = `${origin}/operate/${b.id}`;
        const overlayTopUrl = `${origin}/overlay/${b.id}?theme=topbar`;
        const overlayBottomUrl = `${origin}/overlay/${b.id}?theme=bottom`;
        const overlayMiniUrl = `${origin}/overlay/${b.id}?theme=mini`;
        const liveUrl = `${origin}/live/${b.id}`;

        return `
          <div class="board-item" id="board-item-${b.id}" data-search="${escapeHtml(searchKeywords)}">
            <!-- Summary Header / Click to Expand Details -->
            <div class="board-item-header" onclick="toggleBoardDetails('${b.id}')">
              <div class="board-header-left">
                <span class="board-expand-indicator" id="expand-icon-${b.id}" title="Özellikleri Aç / Kapat">▶</span>
                <div class="board-title-group">
                  <div class="board-title-row">
                    <span class="board-item-title">${escapeHtml(b.title || b.name)}</span>
                    <span class="board-code-badge">#${escapeHtml(b.id)}</span>
                  </div>
                  ${b.subtitle ? `<div class="board-item-sub">${escapeHtml(b.subtitle)}</div>` : ''}
                </div>
              </div>

              <div class="board-header-match">
                <div class="mini-team" title="${escapeHtml(teamAName)}">
                  ${logoA}
                  <span>${escapeHtml(teamAShort)}</span>
                </div>
                <div class="board-score-badge">
                  ${setsWonA} - ${setsWonB}
                  <span class="board-score-points">(${ptsA}-${ptsB})</span>
                </div>
                <div class="mini-team" title="${escapeHtml(teamBName)}">
                  ${logoB}
                  <span>${escapeHtml(teamBShort)}</span>
                </div>
              </div>

              <div class="board-header-right">
                <div class="board-date-badge">
                  <span class="board-date-label">Açılış Tarihi</span>
                  <span class="board-date-value">📅 ${createdDateStr}</span>
                </div>
                <div class="board-quick-actions">
                  <a href="${controlUrl}" target="_blank" class="btn-action-sm btn-primary" onclick="event.stopPropagation()" title="Tam yetkili yönetici paneli">
                    👑 Yönet
                  </a>
                  <a href="${operateUrl}" target="_blank" class="btn-action-sm btn-op" onclick="event.stopPropagation()" title="Hakem/skorcu paneli (şifresiz)">
                    📱 Skorcu
                  </a>
                  <button class="btn-delete-board" onclick="event.stopPropagation(); deleteBoard('${b.id}', '${escapeHtml(b.title || b.id)}')" title="Skorboardu Sil">
                    🗑️
                  </button>
                </div>
              </div>
            </div>

            <!-- Expandable Details / Properties Panel -->
            <div class="board-details-panel" id="details-${b.id}">
              <!-- Match Banner in Details -->
              <div class="match-full-banner">
                <div class="match-full-team">
                  ${fullLogoA}
                  <div>
                    <div style="color: var(--text-heading); font-weight: 800;">${escapeHtml(teamAName)}</div>
                    <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted);">${escapeHtml(teamAShort)}</div>
                  </div>
                </div>

                <div class="match-full-center">
                  <div class="match-full-sets">${setsWonA} - ${setsWonB}</div>
                  <div class="match-full-points">${b.currentSet || 1}. Set Skoru: ${ptsA} - ${ptsB}</div>
                  <span class="match-status-pill ${statusClass}">${statusText}</span>
                </div>

                <div class="match-full-team" style="flex-direction: row-reverse; text-align: right;">
                  ${fullLogoB}
                  <div>
                    <div style="color: var(--text-heading); font-weight: 800;">${escapeHtml(teamBName)}</div>
                    <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted);">${escapeHtml(teamBShort)}</div>
                  </div>
                </div>
              </div>

              <!-- Links & Details Grid -->
              <div class="details-grid">
                <!-- Kumanda Bağlantıları -->
                <div class="details-box">
                  <div class="links-accordion-title">🎛️ Kumanda Bağlantıları</div>
                  
                  <div class="link-row">
                    <div class="link-info" title="Tam yetkili yönetici paneli">
                      <span>👑</span>
                      <span>Yönetici Kumandası</span>
                    </div>
                    <div class="link-actions">
                      <button class="btn-action-sm" onclick="event.stopPropagation(); copyLink('${controlUrl}', this)">📋 Kopyala</button>
                      <a href="${controlUrl}" target="_blank" class="btn-action-sm btn-primary" onclick="event.stopPropagation()">🔗 Aç</a>
                    </div>
                  </div>

                  <div class="link-row">
                    <div class="link-info" title="Hakem/skorcuya verilecek şifresiz sadece skor girme linki">
                      <span>📱</span>
                      <span>Skorcu Kumandası (Şifresiz)</span>
                    </div>
                    <div class="link-actions">
                      <button class="btn-action-sm" onclick="event.stopPropagation(); copyLink('${operateUrl}', this)">📋 Kopyala</button>
                      <a href="${operateUrl}" target="_blank" class="btn-action-sm btn-op" onclick="event.stopPropagation()">🔗 Aç</a>
                    </div>
                  </div>

                  <div style="margin-top: 10px; font-size: 0.78rem; color: var(--text-muted); line-height: 1.4;">
                    💡 <strong>İpucu:</strong> Skorcu Kumandası bağlantısını salon görevlisine veya hakeme gönderebilirsiniz. Yönetici ayarlarına erişemez, sadece sayı ve mola girebilir.
                  </div>
                </div>

                <!-- Yayın Linkleri -->
                <div class="details-box">
                  <div class="links-accordion-title">📺 OBS & Ekran Bağlantıları</div>
                  
                  <div class="link-row">
                    <div class="link-info">
                      <span>⬆️</span>
                      <span>OBS Üst Bar (Top Bar)</span>
                    </div>
                    <div class="link-actions">
                      <button class="btn-action-sm" onclick="event.stopPropagation(); copyLink('${overlayTopUrl}', this)">📋 Kopyala</button>
                      <a href="${overlayTopUrl}" target="_blank" class="btn-action-sm" onclick="event.stopPropagation()">🔗 Aç</a>
                    </div>
                  </div>

                  <div class="link-row">
                    <div class="link-info">
                      <span>⬇️</span>
                      <span>OBS Alt Bant (Lower Third)</span>
                    </div>
                    <div class="link-actions">
                      <button class="btn-action-sm" onclick="event.stopPropagation(); copyLink('${overlayBottomUrl}', this)">📋 Kopyala</button>
                      <a href="${overlayBottomUrl}" target="_blank" class="btn-action-sm" onclick="event.stopPropagation()">🔗 Aç</a>
                    </div>
                  </div>

                  <div class="link-row">
                    <div class="link-info">
                      <span>🔲</span>
                      <span>OBS Mini Skor (Köşe Bug)</span>
                    </div>
                    <div class="link-actions">
                      <button class="btn-action-sm" onclick="event.stopPropagation(); copyLink('${overlayMiniUrl}', this)">📋 Kopyala</button>
                      <a href="${overlayMiniUrl}" target="_blank" class="btn-action-sm" onclick="event.stopPropagation()">🔗 Aç</a>
                    </div>
                  </div>

                  <div class="link-row">
                    <div class="link-info">
                      <span>🏟️</span>
                      <span>Salon / Seyirci Ekranı</span>
                    </div>
                    <div class="link-actions">
                      <button class="btn-action-sm" onclick="event.stopPropagation(); copyLink('${liveUrl}', this)">📋 Kopyala</button>
                      <a href="${liveUrl}" target="_blank" class="btn-action-sm" onclick="event.stopPropagation()">🔗 Aç</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // If search input had text, apply filtering immediately
      const searchInput = document.getElementById('board-search-input');
      if (searchInput && searchInput.value) {
        filterBoards(searchInput.value);
      }
    } catch (e) {
      listEl.innerHTML = '<div style="color: #ef4444; padding: 20px;">Skorboardlar alınırken hata oluştu.</div>';
    }
  }

  // Copy helper
  function copyLink(url, btnEl) {
    navigator.clipboard.writeText(url).then(() => {
      const orig = btnEl.textContent;
      btnEl.textContent = '✓ Kopyalandı';
      btnEl.style.color = '#ffed00';
      setTimeout(() => {
        btnEl.textContent = orig;
        btnEl.style.color = '';
      }, 1800);
    }).catch(() => {
      prompt('Bağlantıyı kopyalayın:', url);
    });
  }

  // Delete Board
  async function deleteBoard(id, name) {
    if (!confirm(`"${name}" skorboardunu silmek istediğinizden emin misiniz? Bu işlem geri alınamaz.`)) {
      return;
    }
    try {
      const res = await fetch(`/api/boards/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok && data.success) {
        const item = document.getElementById(`board-item-${id}`) || document.getElementById(`card-${id}`);
        if (item) item.remove();
        loadBoards();
      } else {
        alert(data.error || 'Silme başarısız oldu.');
      }
    } catch (e) {
      alert('Silme sırasında hata oluştu.');
    }
  }

  // Team Selection Handlers in Modal
  const selTeamA = document.getElementById('select-team-a');
  const selTeamB = document.getElementById('select-team-b');

  if (selTeamA) {
    selTeamA.addEventListener('change', (e) => {
      const id = e.target.value;
      const team = userTeams.find(t => t.id === id);
      if (team) {
        selectedTeamA = team;
        document.getElementById('team-a-name').value = team.name || '';
        document.getElementById('team-a-short').value = team.shortName || '';
      } else {
        selectedTeamA = null;
      }
    });
  }

  if (selTeamB) {
    selTeamB.addEventListener('change', (e) => {
      const id = e.target.value;
      const team = userTeams.find(t => t.id === id);
      if (team) {
        selectedTeamB = team;
        document.getElementById('team-b-name').value = team.name || '';
        document.getElementById('team-b-short').value = team.shortName || '';
      } else {
        selectedTeamB = null;
      }
    });
  }

  // Modal handlers
  const modal = document.getElementById('modal-new-board');
  function openCreateModal() {
    selectedTeamA = null;
    selectedTeamB = null;
    loadUserTeams();
    modal.style.display = 'flex';
    document.getElementById('board-title').focus();
  }
  function closeModal() {
    modal.style.display = 'none';
  }

  document.getElementById('btn-new-board').addEventListener('click', openCreateModal);
  document.getElementById('btn-hero-new').addEventListener('click', openCreateModal);
  document.getElementById('btn-close-modal').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // Form submit
  document.getElementById('form-create-board').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-board');
    btn.disabled = true;
    btn.textContent = 'Oluşturuluyor...';

    const title = document.getElementById('board-title').value.trim();
    const subtitle = document.getElementById('board-subtitle').value.trim();
    const preset = document.getElementById('board-preset').value;
    const teamAName = document.getElementById('team-a-name').value.trim();
    const teamAShort = document.getElementById('team-a-short').value.trim() || teamAName.slice(0, 3).toUpperCase();
    const teamBName = document.getElementById('team-b-name').value.trim();
    const teamBShort = document.getElementById('team-b-short').value.trim() || teamBName.slice(0, 3).toUpperCase();

    const payload = {
      title,
      subtitle,
      preset,
      teamA: {
        name: teamAName,
        shortName: teamAShort,
        color: selectedTeamA ? selectedTeamA.color : undefined,
        color2: selectedTeamA ? selectedTeamA.color2 : undefined,
        accentColor: selectedTeamA ? selectedTeamA.color : undefined,
        logo: selectedTeamA ? (selectedTeamA.logo || '') : undefined
      },
      teamB: {
        name: teamBName,
        shortName: teamBShort,
        color: selectedTeamB ? selectedTeamB.color : undefined,
        color2: selectedTeamB ? selectedTeamB.color2 : undefined,
        accentColor: selectedTeamB ? selectedTeamB.color : undefined,
        logo: selectedTeamB ? (selectedTeamB.logo || '') : undefined
      }
    };

    try {
      const res = await fetch('/api/boards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        alert(data.error || 'Skorboard oluşturulamadı.');
        btn.disabled = false;
        btn.textContent = 'Skorboardu Oluştur';
        return;
      }

      closeModal();
      document.getElementById('form-create-board').reset();
      selectedTeamA = null;
      selectedTeamB = null;
      btn.disabled = false;
      btn.textContent = 'Skorboardu Oluştur';
      loadBoards();
    } catch (err) {
      alert('Sunucu hatası oluştu.');
      btn.disabled = false;
      btn.textContent = 'Skorboardu Oluştur';
    }
  });

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Init
  checkAuth();
</script>

<script src="/js/theme.js"></script>
</body>
</html>
